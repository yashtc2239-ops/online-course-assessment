{% extends "onlinecourse/base.html" %}{% block content %}<h1 class="mb-4">Available Courses</h1><div class="row">{% for course in course_list %}<div class="col-md-6"><div class="card mb-3"><div class="card-body"><h2 class="h4">{{ course.name }}</h2><p>{{ course.description }}</p><a class="btn btn-primary" href="{% url 'onlinecourse:course_details' course.id %}">View course</a></div></div></div>{% empty %}<p>No courses are available.</p>{% endfor %}</div>{% endblock %}
